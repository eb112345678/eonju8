DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대화 잇기 AI 코치 - TalkFlow AI</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
    .gradient-text {
      background: linear-gradient(135deg, #60a5fa 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .pulse-animation {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/20">
          <i class="fa-solid fa-comments text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold gradient-text">TalkFlow AI</h1>
          <p class="text-xs text-slate-400">스마트 대화 코칭 & 감정 분석 솔루션</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-animation"></span> AI 실시간 가동 중
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Input Form (5 cols) -->
    <section class="lg:col-span-5 flex flex-col gap-6">
      <div class="glass-panel p-6 rounded-2xl shadow-xl">
        <div class="flex items-center gap-2 mb-4 text-purple-400 font-semibold text-sm">
          <i class="fa-solid fa-sliders"></i>
          <h2>1. 대화 설정 & 입력</h2>
        </div>

        <!-- Relationship Category -->
        <div class="mb-5">
          <label class="block text-xs font-medium text-slate-300 mb-2">상대방과의 관계</label>
          <div class="grid grid-cols-2 gap-2" id="relationGroup">
            <button type="button" onclick="selectRelation(this, '소개팅 / 썸')" class="relation-btn active p-2.5 rounded-xl border border-purple-500/50 bg-purple-500/10 text-purple-300 text-xs font-medium text-left flex items-center gap-2 transition">
              <i class="fa-solid fa-heart text-pink-400"></i> 소개팅 / 썸
            </button>
            <button type="button" onclick="selectRelation(this, '연인')" class="relation-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-400 text-xs font-medium text-left flex items-center gap-2 hover:border-slate-600 transition">
              <i class="fa-solid fa-rings-wedding text-rose-400"></i> 연인
            </button>
            <button type="button" onclick="selectRelation(this, '직장 동료 / 상사')" class="relation-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-400 text-xs font-medium text-left flex items-center gap-2 hover:border-slate-600 transition">
              <i class="fa-solid fa-briefcase text-blue-400"></i> 직장 동료/상사
            </button>
            <button type="button" onclick="selectRelation(this, '친구')" class="relation-btn p-2.5 rounded-xl border border-slate-700 bg-slate-900/60 text-slate-400 text-xs font-medium text-left flex items-center gap-2 hover:border-slate-600 transition">
              <i class="fa-solid fa-user-group text-amber-400"></i> 친구
            </button>
          </div>
        </div>

        <!-- Desired Tone -->
        <div class="mb-5">
